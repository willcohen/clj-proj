<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>PROJ WASM Browser Test</title>
    <!-- Port 8090 is a second origin, as a CDN is. It serves node_modules. -->
    <script type="importmap">
    {
        "imports": {
            "squint-cljs/core.js": "http://localhost:8090/src/cljc/net/willcohen/proj/node_modules/squint-cljs/core.js",
            "squint-cljs/src/squint/string.js": "http://localhost:8090/src/cljc/net/willcohen/proj/node_modules/squint-cljs/src/squint/string.js",
            "resource-tracker": "http://localhost:8090/src/cljc/net/willcohen/proj/node_modules/resource-tracker/resource.mjs",
            "worker-router": "http://localhost:8090/src/cljc/net/willcohen/proj/node_modules/worker-router/dist/index.mjs",
            "worker-router/worker-bootstrap": "http://localhost:8090/src/cljc/net/willcohen/proj/node_modules/worker-router/dist/worker-bootstrap.mjs",
            "comlink": "http://localhost:8090/src/cljc/net/willcohen/proj/node_modules/comlink/dist/esm/comlink.mjs",
            "ffi-wasm": "http://localhost:8090/src/cljc/net/willcohen/proj/node_modules/ffi-wasm/dist/ffi-wasm.mjs",
            "proj-wasm": "/src/cljc/net/willcohen/proj/dist/proj.mjs"
        }
    }
    </script>
</head>
<body>
    <h1>PROJ WASM Browser Test</h1>
    <div id="status">Loading...</div>
    <div id="results"></div>
    
    <script type="module">
        import * as proj from 'proj-wasm';
        
        // Make proj available globally for testing
        window.proj = proj;
        
        async function runTests() {
            const status = document.getElementById('status');
            const results = document.getElementById('results');
            
            try {
                status.textContent = 'PROJ module loaded, ready for tests';
                results.innerHTML += '<p>Module loaded and available</p>';
                console.log('PROJ module loaded and available for testing');
                
            } catch (error) {
                status.textContent = 'Error loading PROJ module!';
                results.innerHTML += `<p>Error: ${error.message}</p>`;
                console.error('Error loading PROJ module:', error);
            }
        }

        runTests();
    </script>
</body>
</html>
