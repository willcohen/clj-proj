<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>PROJ WASM Browser Test</title>
    <script type="importmap">
    {
        "imports": {
            "squint-cljs/core.js": "https://cdn.jsdelivr.net/npm/squint-cljs@0.14.206/core.js",
            "squint-cljs/src/squint/string.js": "https://cdn.jsdelivr.net/npm/squint-cljs@0.14.206/src/squint/string.js",
            "resource-tracker": "/src/cljc/net/willcohen/proj/dist/resource-tracker.mjs",
            "worker-router": "/src/cljc/net/willcohen/proj/dist/worker-router.mjs",
            "worker-router/worker-bootstrap": "/src/cljc/net/willcohen/proj/dist/worker-bootstrap.mjs",
            "comlink": "/src/cljc/net/willcohen/proj/dist/comlink.mjs",
            "proj-wasm": "/src/cljc/net/willcohen/proj/dist/proj.mjs"
        }
    }
    </script>
</head>
<body>
    <h1>PROJ WASM Browser Test</h1>
    <div id="status">Loading...</div>
    <div id="results"></div>
    
    <script type="module">
        import * as proj from 'proj-wasm';
        
        // Make proj available globally for testing
        window.proj = proj;
        
        async function runTests() {
            const status = document.getElementById('status');
            const results = document.getElementById('results');
            
            try {
                status.textContent = 'PROJ module loaded, ready for tests';
                results.innerHTML += '<p>Module loaded and available</p>';
                console.log('PROJ module loaded and available for testing');
                
            } catch (error) {
                status.textContent = 'Error loading PROJ module!';
                results.innerHTML += `<p>Error: ${error.message}</p>`;
                console.error('Error loading PROJ module:', error);
            }
        }

        runTests();
    </script>
</body>
</html>
